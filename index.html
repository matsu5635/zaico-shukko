<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZAICO 出庫</title>
<style>
  :root {
    --bg: #121417;
    --card: #1e2127;
    --card-border: #2b2f36;
    --text: #f0f0f0;
    --sub: #9aa0a8;
    --accent: #26c281;
    --accent-dim: #1c3d31;
    --danger: #e2574c;
    --warn: #f0ad4e;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 480px;
    margin: 0 auto;
    padding: 0 0 32px;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    font-size: 17px;
    font-weight: 600;
    border-bottom: 1px solid var(--card-border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 5;
  }
  .route-bar {
    text-align: center;
    padding: 10px 16px;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-dim);
  }
  .content { padding: 16px; }
  h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--sub);
    letter-spacing: .04em;
    margin: 22px 0 10px;
  }
  button {
    font-size: 15px;
    padding: 12px 16px;
    margin: 6px 0;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text);
  }
  button.primary {
    background: var(--accent);
    color: #08221a;
    border: none;
    font-weight: 700;
    width: 100%;
  }
  button.danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
    width: 100%;
  }
  button.ghost {
    background: transparent;
    color: var(--sub);
    border: none;
  }
  button.wide { width: 100%; }
  button.tile {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    text-align: left;
    padding: 16px;
    margin-bottom: 10px;
  }
  button.tile .arrow { color: var(--sub); }
  button.tile .sub { display: block; color: var(--sub); font-size: 13px; margin-top: 4px; }
  button.tile .qty { font-weight: 700; color: var(--accent); white-space: nowrap; margin-left: 12px; }
  button.tile.canceled { opacity: .5; }
  button:disabled { opacity: .5; }

  .card {
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 16px;
    margin: 12px 0;
    background: var(--card);
  }
  .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 0;
    border-bottom: 1px solid var(--card-border);
    font-size: 15px;
  }
  .row:last-child { border-bottom: none; }
  .row .label { color: var(--sub); font-size: 13px; }
  .row .value { font-weight: 600; text-align: right; word-break: break-all; }

  .pill {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--accent-dim);
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
  }

  .announce {
    text-align: center;
    border: 2px solid var(--accent);
    border-radius: 14px;
    padding: 18px 12px;
    margin: 12px 0;
  }
  .announce.danger { border-color: var(--danger); }
  .announce .big { font-size: 26px; font-weight: 800; letter-spacing: .02em; }
  .announce .mid { font-size: 17px; font-weight: 700; margin-top: 6px; }

  #reader-badge, #reader-product { width: 100%; border-radius: 14px; overflow: hidden; border: 1px solid var(--card-border); }

  .modebar { display: flex; gap: 8px; margin: 4px 0 12px; }
  .modebar button { flex: 1; margin: 0; font-size: 14px; padding: 10px 8px; }
  .modebar button.on { background: var(--accent); color: #08221a; border-color: var(--accent); font-weight: 700; }
  .reader-box input[type=text] { font-size: 20px; }
  .reader-hint { font-size: 13px; color: var(--sub); margin-bottom: 6px; }

  .error { color: var(--danger); white-space: pre-wrap; font-size: 14px; }
  .ok { color: var(--accent); white-space: pre-wrap; font-size: 15px; font-weight: 600; }
  .small { font-size: 12px; color: var(--sub); margin-top: 10px; }
  .status { font-size: 14px; color: var(--accent); margin: 10px 0; }

  input[type=number], input[type=text] {
    font-size: 18px;
    padding: 12px;
    width: 100%;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: #0f1114;
    color: var(--text);
    margin: 8px 0;
  }
  a { color: var(--accent); text-decoration: none; }
  .hidden { display: none; }
</style>
</head>
<body>

  <div class="topbar">
    <span>ZAICO 出庫</span>
    <span id="badge-mark" class="pill hidden">読み取り済み</span>
  </div>
  <div class="route-bar" id="route-bar">読み込み中…</div>

  <div class="content">

    <div id="step-badge" class="hidden">
      <h2>① 自分のバッジ（QR）を読んでください</h2>
      <div class="modebar">
        <button id="mode-camera" onclick="setInputMode('camera')">カメラで読む</button>
        <button id="mode-reader" onclick="setInputMode('reader')">リーダーで読む</button>
      </div>
      <div id="reader-badge"></div>
      <button id="manual-badge-btn" onclick="showManualBadge()">カメラを使わず入力する</button>
      <div id="manual-badge-box" class="hidden reader-box">
        <div class="reader-hint" id="manual-badge-hint">バッジのQRをリーダーで読んでください</div>
        <input type="text" id="manual-badge" placeholder="バッジのコード" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" inputmode="none">
        <button class="primary" onclick="submitBadgeInput()">これで進む</button>
        <button class="ghost" onclick="showKeyboard('manual-badge')">キーボードを出して手で入力する</button>
      </div>
    </div>

    <div id="step-scan" class="hidden">
      <h2>② 移動する品物のQRコードを読み取ってください</h2>
      <div class="modebar">
        <button id="mode-camera2" onclick="setInputMode('camera')">カメラで読む</button>
        <button id="mode-reader2" onclick="setInputMode('reader')">リーダーで読む</button>
      </div>
      <div id="reader-product"></div>
      <div id="scan-status" class="status hidden">検索しています…</div>
      <button id="manual-product-btn" onclick="showManualProduct()">カメラを使わず番号を入力する</button>
      <div id="manual-product-box" class="hidden reader-box">
        <div class="reader-hint" id="manual-product-hint">品物のQRをリーダーで読んでください</div>
        <input type="text" id="manual-product" placeholder="QRコードの値" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" inputmode="none">
        <button class="primary" onclick="submitProductInput()">検索する</button>
        <button class="ghost" onclick="showKeyboard('manual-product')">キーボードを出して手で入力する</button>
      </div>
      <button class="wide" onclick="openHistory()">今日の自分の移動（取り消し・数量の修正）</button>
    </div>

    <div id="step-choose" class="hidden">
      <h2>同じQRの品目が複数あります。移動するものを選んでください</h2>
      <div id="choose-buttons"></div>
      <button onclick="backToScan()">別のQRを読み直す</button>
    </div>

    <div id="step-item" class="hidden">
      <h2>③ 品目を確認して、移動する数量を入れてください</h2>
      <div class="card" id="item-card"></div>
      <input type="number" id="qty-input" min="0" step="any" inputmode="decimal" placeholder="移動する数量">
      <div id="qty-error" class="error"></div>
      <button class="primary" onclick="toConfirmShip()">次へ</button>
      <button class="ghost" onclick="backToScan()">別のQRを読み直す</button>
    </div>

    <div id="step-confirm" class="hidden">
      <h2 id="confirm-heading">④ 内容を確認してください</h2>
      <div class="announce" id="confirm-announce"></div>
      <div class="card" id="confirm-card"></div>
      <button class="primary" id="confirm-ok">実行する</button>
      <button class="wide" onclick="speakAgain()">🔊 もう一度聞く</button>
      <button class="ghost" id="confirm-cancel">やめて戻る</button>
    </div>

    <div id="step-result" class="hidden">
      <h2>結果</h2>
      <div id="result-box" class="card"></div>
      <div class="small" id="result-note"></div>
      <button class="primary" onclick="resetToScan()">続けて次の品目を移動する</button>
      <button class="wide hidden" id="result-fix" onclick="openRecord(lastRecord)">いまの移動を取り消す・数量を直す</button>
      <button class="wide" onclick="openHistory()">今日の自分の移動を見る</button>
      <button class="ghost" onclick="resetAll()">別の作業者に交代する</button>
    </div>

    <div id="step-history" class="hidden">
      <h2>今日の自分の移動（タップで取り消し・数量の修正）</h2>
      <div id="history-list">読み込み中…</div>
      <button class="wide" onclick="resetToScan()">品物の読み取りに戻る</button>
    </div>

    <div id="step-record" class="hidden">
      <h2>移動の記録</h2>
      <div class="card" id="record-card"></div>
      <div id="record-actions">
        <h2>数量を直す</h2>
        <input type="number" id="fix-qty" min="0" step="any" inputmode="decimal" placeholder="正しい数量">
        <div id="fix-error" class="error"></div>
        <button class="primary" onclick="toConfirmCorrect()">この数量に直す</button>
        <h2>取り消す</h2>
        <button class="danger" onclick="toConfirmCancel()">この移動を取り消す</button>
      </div>
      <button class="ghost" onclick="openHistory()">一覧に戻る</button>
    </div>

  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    /* Apps Scriptを「ウェブアプリ」として公開したときのURL（.../exec） */
    const API_URL = 'https://script.google.com/macros/s/AKfycby4fPD369fS5gT5r7NiyB8u3Ip3NZjSe3t_F3eBPDXwvFR49JJ4fkpEyctRC8b5xIBN/exec';

    /* 読み上げのときの工場名の読み方（漢字のままだと読み間違えることがあるため） */
    const READINGS = { '戎島': 'えびすじま', '河内長野': 'かわちながの', '日本カラー': 'にほんカラー' };
    /* 読み上げのときの製品名の読み方（読み方を足したいときは、ここに1行ずつ追加する） */
    const TITLE_READINGS = [
      [/BAX/gi, 'ばっくす']
    ];

    let workerToken = null;
    let route = { from: '', to: '' };
    let currentItem = null;
    let currentRecord = null;
    let lastRecord = null;
    let scanner = null;       // いま動いているカメラ
    let scanHandled = false;  // 同じQRを何度も読んで二重に処理しないための目印
    let lastSpeech = '';
    let inputMode = 'camera';   // 'camera'＝カメラで読む／'reader'＝ハンディターミナル等のリーダーで読む

    const STEPS = ['step-badge', 'step-scan', 'step-choose', 'step-item', 'step-confirm', 'step-result', 'step-history', 'step-record'];

    /* ---------------- 起動 ---------------- */
    try { inputMode = localStorage.getItem('zaicoInputMode') || 'camera'; } catch (e) {}
    setupReaderInput('manual-badge', submitBadgeInput);
    setupReaderInput('manual-product', submitProductInput);
    show('step-badge');
    applyInputMode();
    loadRoute();

    /* ---------------- APIを呼ぶ共通処理 ---------------- */
    async function callApi(action, params) {
      const body = Object.assign({ action: action }, params || {});
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // プリフライトを避けるためtext/plainで送る
        body: JSON.stringify(body)
      });
      return res.json();
    }

    function loadRoute() {
      callApi('route', {}).then(function (res) {
        if (!res.ok) { document.getElementById('route-bar').textContent = res.msg; return; }
        route = { from: res.from, to: res.to };
        document.getElementById('route-bar').textContent = route.from + ' → ' + route.to + ' の移動';
      }).catch(function (err) {
        document.getElementById('route-bar').textContent = '接続先に問題があります（' + err + '）';
      });
    }

    /* ---------------- 読み上げ ---------------- */
    function speak(text) {
      lastSpeech = text;
      try {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ja-JP';
        u.rate = 1.0;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }
    function speakAgain() { if (lastSpeech) speak(lastSpeech); }
    function reading(name) { return READINGS[name] || name; }
    /* 製品名を読み上げ用に直す（「-」は「まいなす」と読まれないよう区切りにする） */
    function titleReading(title) {
      let t = String(title || '');
      TITLE_READINGS.forEach(function (r) { t = t.replace(r[0], r[1]); });
      return t.replace(/[-－‐]/g, ' ');
    }

    /* ---------------- カメラの開始・停止 ---------------- */
    function stopScan() {
      const s = scanner;
      scanner = null;
      if (!s) return Promise.resolve();
      let p;
      try { p = s.stop(); } catch (e) { p = Promise.resolve(); }
      return Promise.resolve(p).catch(function () {}).then(function () {
        try { s.clear(); } catch (e) {}
      });
    }

    function startScan(elementId, onDecoded, failMsg) {
      return stopScan().then(function () {
        const box = document.getElementById(elementId);
        box.innerHTML = '';
        scanHandled = false;
        const s = new Html5Qrcode(elementId);
        scanner = s;
        return s.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: 220 },
          function (decodedText) {
            if (scanHandled) return;
            scanHandled = true;
            onDecoded(decodedText);
          }
        ).catch(function () {
          if (scanner === s) scanner = null;
          box.innerHTML = '<div class="error">' + failMsg + '</div>';
        });
      });
    }

    /* ---------------- 読み取り方法（カメラ／リーダー）の切り替え ---------------- */
    function setInputMode(mode) {
      inputMode = mode;
      try { localStorage.setItem('zaicoInputMode', mode); } catch (e) {}
      applyInputMode();
    }

    /* いまの画面に、選ばれている読み取り方法を反映する */
    function applyInputMode() {
      const reader = (inputMode === 'reader');
      [['mode-camera', !reader], ['mode-reader', reader],
       ['mode-camera2', !reader], ['mode-reader2', reader]].forEach(function (x) {
        const el = document.getElementById(x[0]);
        if (el) el.classList.toggle('on', x[1]);
      });
      const onBadge = !document.getElementById('step-badge').classList.contains('hidden');
      const onScanStep = !document.getElementById('step-scan').classList.contains('hidden');
      if (!onBadge && !onScanStep) return;

      const idBox = onBadge ? 'manual-badge-box' : 'manual-product-box';
      const idBtn = onBadge ? 'manual-badge-btn' : 'manual-product-btn';
      const idCam = onBadge ? 'reader-badge' : 'reader-product';
      const idInput = onBadge ? 'manual-badge' : 'manual-product';

      if (reader) {
        // リーダーで読む：カメラは止めて、入力欄を出してカーソルを合わせる
        stopScan();
        document.getElementById(idCam).classList.add('hidden');
        document.getElementById(idBtn).classList.add('hidden');
        document.getElementById(idBox).classList.remove('hidden');
        focusReaderInput(idInput);
      } else {
        document.getElementById(idCam).classList.remove('hidden');
        document.getElementById(idBtn).classList.remove('hidden');
        document.getElementById(idBox).classList.add('hidden');
        if (onBadge) { startBadgeScan(); } else { startProductScan(); }
      }
    }

    function focusReaderInput(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.value = '';
      // リーダーで読むときは、画面キーボードを出さない（リーダーからの文字は今までどおり入る）
      el.setAttribute('inputmode', 'none');
      setTimeout(function () { try { el.focus(); } catch (e) {} }, 60);
    }

    /* 手で打ちたいときだけ、画面キーボードを出す */
    function showKeyboard(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.setAttribute('inputmode', 'text');
      el.blur();
      setTimeout(function () { try { el.focus(); el.click(); } catch (e) {} }, 60);
    }

    /* リーダーからの入力を受け取る仕掛け
     * ・Enter（多くのリーダーが読み取りの最後に送る）で確定する
     * ・Enterを送らないリーダーもあるので、文字が一気に入って止まったときも確定する
     * ・人が手で打つ速さでは勝手に確定しない（ボタンで確定する） */
    function setupReaderInput(id, submitFn) {
      const el = document.getElementById(id);
      if (!el) return;
      let burstStart = 0, timer = null;
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.keyCode === 13) {
          e.preventDefault();
          if (timer) { clearTimeout(timer); timer = null; }
          submitFn();
        }
      });
      el.addEventListener('input', function () {
        const now = Date.now();
        if (!burstStart || now - burstStart > 1500) burstStart = now;
        if (timer) clearTimeout(timer);
        timer = setTimeout(function () {
          timer = null;
          const v = el.value.trim();
          const perChar = v.length ? (Date.now() - burstStart) / v.length : 999;
          burstStart = 0;
          // 1文字あたり60ミリ秒より速く入ったものは、リーダーの読み取りとみなす
          if (v.length >= 3 && perChar < 60) submitFn();
        }, 300);
      });
    }

    function submitBadgeInput() { onBadgeScanned(document.getElementById('manual-badge').value); }
    function submitProductInput() { onScan(document.getElementById('manual-product').value); }

    /* ---------------- ① バッジを読む ---------------- */
    function startBadgeScan() {
      startScan('reader-badge', onBadgeScanned,
        'カメラを使えませんでした。上の「リーダーで読む」からお続けください。');
    }
    function showManualBadge() {
      stopScan();
      document.getElementById('manual-badge-box').classList.remove('hidden');
      focusReaderInput('manual-badge');
    }
    function onBadgeScanned(token) {
      token = String(token || '').trim();
      if (!token) return;
      stopScan();
      workerToken = token;
      document.getElementById('manual-badge').value = '';
      if (inputMode !== 'reader') document.getElementById('manual-badge-box').classList.add('hidden');
      document.getElementById('badge-mark').classList.remove('hidden');
      backToScan();
    }

    /* ---------------- ② 品物のQR読み取り ---------------- */
    function startProductScan() {
      if (inputMode === 'reader') { focusReaderInput('manual-product'); return; }
      startScan('reader-product', onScan,
        'カメラを使えませんでした。上の「リーダーで読む」からお続けください。');
    }
    function showManualProduct() {
      stopScan();
      document.getElementById('manual-product-box').classList.remove('hidden');
      focusReaderInput('manual-product');
    }

    function onScan(code) {
      code = String(code || '').trim();
      if (!code) return;
      stopScan();
      setSearching(true);
      callApi('lookup', { workerToken: workerToken, code: code }).then(function (res) {
        setSearching(false);
        if (!res.ok) { handleError(res); return; }
        if (res.items.length === 1) {
          showItem(res.items[0]);
        } else {
          showChoices(res.items);
        }
      }).catch(function (err) {
        setSearching(false);
        alert('通信に失敗しました：' + err);
        backToScan();
      });
    }
    function setSearching(on) {
      document.getElementById('scan-status').classList.toggle('hidden', !on);
    }
    function backToScan() {
      document.getElementById('manual-product').value = '';
      if (inputMode !== 'reader') document.getElementById('manual-product-box').classList.add('hidden');
      show('step-scan');
      applyInputMode();
    }
    /* エラーを伝えて、バッジの問題ならバッジから、それ以外はQR読み取りからやり直す */
    function handleError(res) {
      alert(res.msg);
      if (res.reason === 'badToken') { resetAll(); } else { backToScan(); }
    }

    /* ---------------- 同じQRの品目が複数あるときの選択 ---------------- */
    function showChoices(items) {
      const box = document.getElementById('choose-buttons');
      box.innerHTML = '';
      items.forEach(function (it) {
        const b = document.createElement('button');
        b.className = 'tile';
        b.innerHTML =
          '<span>' + escapeHtml(it.title) +
            '<span class="sub">' + (it.lot ? 'Lot ' + escapeHtml(it.lot) + '　' : '') + escapeHtml(placeText(it)) + '</span></span>' +
          '<span class="qty">在庫 ' + escapeHtml(it.quantity) + '</span>';
        b.onclick = function () { showItem(it); };
        box.appendChild(b);
      });
      show('step-choose');
    }
    function placeText(it) {
      return [it.warehouse, it.place].filter(function (s) { return s; }).join(' / ') || '置き場所の登録なし';
    }

    /* ---------------- ③ 品目表示・数量入力 ---------------- */
    function showItem(item) {
      currentItem = item;
      document.getElementById('item-card').innerHTML =
        row('製品コード', item.productCode) +
        row('製品名', item.title) +
        row('入目', item.iremono) +
        row('Lot', item.lot) +
        row('置き場所', placeText(item)) +
        row('在庫数（' + route.from + '）', item.quantity);
      document.getElementById('qty-input').value = '';
      document.getElementById('qty-error').textContent = '';
      show('step-item');
    }

    function toConfirmShip() {
      const qty = Number(document.getElementById('qty-input').value);
      const errBox = document.getElementById('qty-error');
      errBox.textContent = '';
      if (!(qty > 0)) { errBox.textContent = '数量を入力してください。'; return; }
      if (qty > currentItem.quantity) {
        errBox.textContent = '在庫（' + currentItem.quantity + '）より多い数量は移動できません。';
        return;
      }
      showConfirm({
        heading: '④ 内容を確認してください',
        announce: '<div class="big">' + escapeHtml(route.from) + ' → ' + escapeHtml(route.to) + '</div>' +
                  '<div class="mid">に移動します</div>',
        rows: row('製品名', currentItem.title) +
              row('Lot', currentItem.lot) +
              row('移動する数量', qty) +
              row(route.from + 'の在庫', currentItem.quantity + ' → ' + round4(currentItem.quantity - qty)),
        okLabel: '移動する',
        speech: reading(route.from) + 'から、' + reading(route.to) + 'に移動します。' +
                titleReading(currentItem.title) + '、' + qty + '。よろしければ、移動する、を押してください。',
        onOk: function (btn) {
          return callApi('shipOut', { workerToken: workerToken, zaicoId: currentItem.zaicoId, qty: qty })
            .then(function (res) {
              lastRecord = res.record || null;
              showResult(res, '移動しました');
            });
        },
        onCancel: function () { show('step-item'); }
      });
    }

    /* ---------------- 確認画面（移動・取り消し・修正で共通） ---------------- */
    function showConfirm(o) {
      document.getElementById('confirm-heading').textContent = o.heading;
      const ann = document.getElementById('confirm-announce');
      ann.className = 'announce' + (o.danger ? ' danger' : '');
      ann.innerHTML = o.announce;
      document.getElementById('confirm-card').innerHTML = o.rows;
      const ok = document.getElementById('confirm-ok');
      ok.textContent = o.okLabel;
      ok.className = o.danger ? 'danger' : 'primary';
      ok.disabled = false;
      ok.onclick = function () {
        ok.disabled = true;
        ok.textContent = '処理しています…';
        o.onOk(ok).catch(function (err) {
          showResult({ ok: false, msg: '通信に失敗しました：' + err + '\nZAICOアプリで在庫数が変わっていないか確認してください。' });
        });
      };
      document.getElementById('confirm-cancel').onclick = function () {
        try { window.speechSynthesis.cancel(); } catch (e) {}
        o.onCancel();
      };
      show('step-confirm');
      speak(o.speech);
    }

    /* ---------------- 結果 ---------------- */
    function showResult(res, okSpeech) {
      const box = document.getElementById('result-box');
      box.className = 'card ' + (res.ok && !res.warn ? 'ok' : 'error');
      box.textContent = res.msg;
      document.getElementById('result-note').textContent = res.note || '';
      document.getElementById('result-fix').classList.toggle('hidden', !(res.ok && res.record));
      if (res.ok && !res.warn) {
        speak(okSpeech || '完了しました');
      } else {
        speak('確認してください。' + (res.ok ? '一部の処理ができませんでした。' : 'できませんでした。'));
      }
      show('step-result');
      if (res.reason === 'badToken') { alert(res.msg); resetAll(); }
    }

    /* ---------------- 今日の自分の移動（取り消し・修正） ---------------- */
    function openHistory() {
      stopScan();
      const box = document.getElementById('history-list');
      box.innerHTML = '読み込み中…';
      show('step-history');
      callApi('myToday', { workerToken: workerToken }).then(function (res) {
        if (!res.ok) { box.innerHTML = '<div class="error">' + escapeHtml(res.msg) + '</div>'; return; }
        if (res.records.length === 0) { box.innerHTML = '<div class="small">今日の移動はまだありません。</div>'; return; }
        box.innerHTML = '';
        res.records.forEach(function (rec) {
          const b = document.createElement('button');
          b.className = 'tile' + (rec.state === '取消済' ? ' canceled' : '');
          b.innerHTML =
            '<span>' + escapeHtml(rec.time + '　' + rec.title) +
              '<span class="sub">' + (rec.lot ? 'Lot ' + escapeHtml(rec.lot) + '　' : '') + escapeHtml(rec.state) + '</span></span>' +
            '<span class="qty">' + escapeHtml(rec.qty) + '</span>';
          b.onclick = function () { openRecord(rec); };
          box.appendChild(b);
        });
      }).catch(function (err) {
        box.innerHTML = '<div class="error">通信に失敗しました：' + escapeHtml(err) + '</div>';
      });
    }

    function openRecord(rec) {
      if (!rec) return;
      stopScan();
      currentRecord = rec;
      document.getElementById('record-card').innerHTML =
        row('時刻', rec.time) +
        row('移動', rec.from + ' → ' + rec.to) +
        row('製品名', rec.title) +
        row('Lot', rec.lot) +
        row('数量', rec.qty) +
        row('状態', rec.state) +
        (rec.history ? row('修正の記録', rec.history) : '');
      document.getElementById('record-actions').classList.toggle('hidden', rec.state === '取消済');
      document.getElementById('fix-qty').value = '';
      document.getElementById('fix-error').textContent = '';
      show('step-record');
    }

    function toConfirmCancel() {
      const rec = currentRecord;
      showConfirm({
        heading: '取り消しの確認',
        danger: true,
        announce: '<div class="big">取り消します</div>' +
                  '<div class="mid">' + escapeHtml(rec.from) + ' の在庫に ' + escapeHtml(rec.qty) + ' 戻します</div>',
        rows: row('製品名', rec.title) + row('Lot', rec.lot) + row('数量', rec.qty) +
              (rec.destAction === '新規作成' ? row(rec.to + 'の品目', 'まだ入庫されていなければ削除します') : ''),
        okLabel: '取り消す',
        speech: 'この移動を取り消します。' + reading(rec.from) + 'の在庫に、' + rec.qty + '戻します。' +
                'よろしければ、取り消す、を押してください。',
        onOk: function () {
          return callApi('cancel', { workerToken: workerToken, recordId: rec.recordId })
            .then(function (res) { lastRecord = null; showResult(res, '取り消しました'); });
        },
        onCancel: function () { show('step-record'); }
      });
    }

    function toConfirmCorrect() {
      const rec = currentRecord;
      const qty = Number(document.getElementById('fix-qty').value);
      const errBox = document.getElementById('fix-error');
      errBox.textContent = '';
      if (!(qty > 0)) { errBox.textContent = '正しい数量を入力してください。（0にしたいときは「取り消す」を使ってください）'; return; }
      if (qty === rec.qty) { errBox.textContent = 'いまの数量と同じです。'; return; }
      const diff = round4(qty - rec.qty);
      showConfirm({
        heading: '数量の修正の確認',
        announce: '<div class="big">' + escapeHtml(rec.qty) + ' → ' + escapeHtml(qty) + '</div>' +
                  '<div class="mid">に数量を直します</div>',
        rows: row('製品名', rec.title) + row('Lot', rec.lot) +
              row(rec.from, diff > 0 ? 'さらに ' + diff + ' 減らす' : (-diff) + ' 戻す') +
              row(rec.to, '変わりません'),
        okLabel: '数量を直す',
        speech: '数量を、' + rec.qty + 'から、' + qty + 'に直します。よろしければ、数量を直す、を押してください。',
        onOk: function () {
          return callApi('correct', { workerToken: workerToken, recordId: rec.recordId, qty: qty })
            .then(function (res) { lastRecord = null; showResult(res, '数量を直しました'); });
        },
        onCancel: function () { show('step-record'); }
      });
    }

    /* ---------------- 共通 ---------------- */
    function resetToScan() {
      currentItem = null;
      backToScan();
    }
    function resetAll() {
      stopScan();
      workerToken = null; currentItem = null; currentRecord = null; lastRecord = null;
      document.getElementById('badge-mark').classList.add('hidden');
      show('step-badge');
      applyInputMode();
    }
    function round4(n) { return Math.round(n * 10000) / 10000; }
    function row(label, value) {
      return '<div class="row"><span class="label">' + escapeHtml(label) + '</span><span class="value">' + escapeHtml(value == null ? '' : String(value)) + '</span></div>';
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function show(id) {
      STEPS.forEach(function (s) {
        document.getElementById(s).classList.toggle('hidden', s !== id);
      });
      window.scrollTo(0, 0);
    }
  </script>
</body>
</html>
